
user  root;
worker_processes  4;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 10M; # 设置上传文件大小限制为 10MB

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    charset utf-8;
    #keepalive_timeout  0;
    #keepalive_timeout  300s;
    keepalive_timeout  300s; #长连接超时
    client_header_timeout  300s; #请求头超时
    client_body_timeout  300s; #请求体超时
    send_timeout  300s; #响应超时
    #gzip  on;
    init_by_lua_file lua/init/init.lua;
    lua_code_cache off;
        #增加库文件放置地方 除了安装位置的lualib外的 此处放在comm中
    lua_package_path '/usr/local/openresty/nginx/lua/comm/?.lua;;';
    #guqinghuan，20250801，add lua cahce
    lua_shared_dict my_cache 128m;

    # 定义Lua共享内存区域，用于在多个worker进程间共享数据
    lua_shared_dict api_keys 10m;

    server {
        listen       80;
        server_name  localhost;
	charset utf-8;
        
        # 防止重定向时丢失端口
        port_in_redirect off;
        absolute_redirect off;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;
        location / {
            root   /data/html;
            index  index.html index.htm;
      }
      location /app {
                alias  /data/html_app/app;
                index  index.html index.htm;
                expires 1h;
        }
      # 重定向 /web 到 /web/
      location = /web {
          return 301 /web/;
      }

      # WVP 前端静态资源
      location /web/ {
          alias /data/html_app/web/;
          index index.html;
          try_files $uri $uri/ /web/index.html;
      }

      # WVP API 反向代理
      location /api/ {
          proxy_pass http://127.0.0.1:18080/api/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }


      location ~ ^/robot/([-_a-zA-Z0-9/]+){
           proxy_set_header Host $host:$server_port;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header REMOTE-HOST $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_pass http://127.0.0.1:8085/$1?$args;
      }
     location ~ ^/robotpc4/([-_a-zA-Z0-9/]+){
           proxy_set_header Host $host:$server_port;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header REMOTE-HOST $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_pass http://127.0.0.1:5819/$1?$args;
      }
      location ~ ^/robot-management/([-_a-zA-Z0-9/]+){
           client_max_body_size 1000m;
           client_body_buffer_size 256k;
           proxy_set_header Host $host:$server_port;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header REMOTE-HOST $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_pass http://127.0.0.1:8089/robot-management/$1?$args;
      }

      location /filePath {
           alias  /data/imge/face_path;
      }

      location /files {
           alias  /data/java/robot-management/files;
      }


      location /navMap {
           alias  /data/imge/dog_map;
      }

      location /live {
           alias  /usr/local/srs/objs/nginx/html/live;
      }
      location ~ ^/video/play{
        resolver 114.114.114.114;
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,token,user-id,time,dev-request-type,dev-model,dev-version,dev-app-version';
                #add_header 'Content-Length' 0;
                add_header 'Content-Type' 'application/json charset=UTF-8';
                if ($request_method = "OPTIONS") {
                        return 204;

                }
                content_by_lua_file lua/video_play.lua;

        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }

server {
      listen       18088;
      server_name  localhost;
      charset utf-8;

      location / {
            root   /data/html_app/go2_app;
            index  index.html index.htm;
      }

      location ~ ^/robot/([-_a-zA-Z0-9/]+){
           proxy_set_header Host $host:$server_port;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header REMOTE-HOST $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_pass http://127.0.0.1:8085/$1?$args;
      }

      location /filePath {
           alias  /data/imge/face_path;
      }

      location /live {
           alias  /usr/local/srs/objs/nginx/html/live;
      }

}
