server {
    listen 80;
    server_name _;

    # 方便：直接访问 IP 时跳到 word-web
    location = / {
        return 302 /word-web/;
    }

    # 兼容：用户手动输入未带前缀的路径时自动跳转
    location = /settings { return 302 /word-web/settings; }
    location = /books    { return 302 /word-web/books; }
    location = /words    { return 302 /word-web/words; }
    location = /login    { return 302 /word-web/login; }
    location = /logout   { return 302 /word-web/logout; }

    # 兼容：未带前缀的 API 调用（如历史书签）
    location /api/ {
        return 302 /word-web$request_uri;
    }

    # 规范化：无尾斜杠时补上
    location = /word-web {
        return 301 /word-web/;
    }

    # 反向代理到 Flask 容器
    location /word-web/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 让后端生成的 url_for / redirect 带上前缀
        proxy_set_header X-Script-Name /word-web;

        # 注意：这里不带结尾的 /，把原始 URI 原样转发给后端
        proxy_pass http://web:5000;
        proxy_redirect off;
    }
}
