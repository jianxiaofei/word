<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 单词学习系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .card { border: none; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
  </style>
</head>
<body>
  <div class="container" style="max-width: 420px; padding-top: 10vh;">
    <div class="text-center mb-4">
      <h3 class="fw-bold">📚 单词学习系统</h3>
      <div class="text-muted">请输入管理员账号密码</div>
    </div>

    <div class="card">
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control" name="username" autocomplete="username" required />
          </div>

          <div class="mb-3">
            <label class="form-label">密码</label>
            <input class="form-control" type="password" name="password" autocomplete="current-password" required />
          </div>

          <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>

        <hr class="my-4" />
        <div class="small text-muted">
          提示：可在服务器 `/root/word/.env` 设置 `WEB_ADMIN_USER`、`WEB_ADMIN_PASSWORD`、`WEB_SECRET_KEY`。
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
