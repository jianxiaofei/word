<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 - 单词学习系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .card { border: none; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
  </style>
</head>
<body>
  <div class="container" style="max-width: 420px; padding-top: 10vh;">
    <div class="text-center mb-4">
      <h3 class="fw-bold">📚 单词学习系统</h3>
      <div class="text-muted">创建一个新账号</div>
    </div>

    <div class="card">
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control" name="username" autocomplete="username" required />
            <div class="form-text">至少 3 个字符</div>
          </div>

          <div class="mb-3">
            <label class="form-label">密码</label>
            <input class="form-control" type="password" name="password" autocomplete="new-password" required />
            <div class="form-text">至少 6 个字符</div>
          </div>

          <div class="mb-3">
            <label class="form-label">确认密码</label>
            <input class="form-control" type="password" name="password2" autocomplete="new-password" required />
          </div>

          <button class="btn btn-primary w-100" type="submit">注册并登录</button>
        </form>

        <div class="text-center mt-3">
          <a href="{{ url_for('login') }}">已有账号？去登录</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
